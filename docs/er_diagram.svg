<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 870" width="1500" height="870" font-family="Arial, Helvetica, sans-serif"><rect width="1500" height="870" fill="#fff"/><text x="750" y="55" text-anchor="middle" font-size="36" font-weight="700">ER Diagram — HSH Supermarket</text><rect x="30" y="100" width="330" height="376" rx="8" fill="#fff" stroke="#2e6b1f" stroke-width="3"/><path d="M30 144 V108 a8 8 0 0 1 8 -8 H352 a8 8 0 0 1 8 8 V144 Z" fill="#d5ead0" stroke="#2e6b1f" stroke-width="3"/><text x="195.0" y="131" text-anchor="middle" font-size="24" font-weight="700" fill="#2e6b1f">Customers</text><line x1="30" x2="360" y1="184" y2="184" stroke="#2e6b1f" stroke-width="2"/><line x1="96" x2="96" y1="144" y2="476" stroke="#2e6b1f" stroke-width="2"/><text x="63" y="171" text-anchor="middle" font-size="19" font-weight="700">PK</text><text x="114" y="171" font-size="21" font-weight="700" text-decoration="underline">customer_id</text><text x="114" y="210.0" font-size="20" fill="#111">first_name</text><text x="114" y="250.0" font-size="20" fill="#111">last_name</text><text x="114" y="290.0" font-size="20" fill="#111">email (UNIQUE)</text><text x="114" y="330.0" font-size="20" fill="#111">phone</text><text x="114" y="370.0" font-size="20" fill="#111">city</text><text x="114" y="410.0" font-size="20" fill="#111">password</text><text x="114" y="450.0" font-size="20" fill="#111">role</text><rect x="560" y="100" width="360" height="336" rx="8" fill="#fff" stroke="#1e3a8a" stroke-width="3"/><path d="M560 144 V108 a8 8 0 0 1 8 -8 H912 a8 8 0 0 1 8 8 V144 Z" fill="#bcd6f2" stroke="#1e3a8a" stroke-width="3"/><text x="740.0" y="131" text-anchor="middle" font-size="24" font-weight="700" fill="#1e3a8a">Orders</text><line x1="560" x2="920" y1="184" y2="184" stroke="#1e3a8a" stroke-width="2"/><line x1="626" x2="626" y1="144" y2="436" stroke="#1e3a8a" stroke-width="2"/><text x="593" y="171" text-anchor="middle" font-size="19" font-weight="700">PK</text><text x="644" y="171" font-size="21" font-weight="700" text-decoration="underline">order_id</text><text x="644" y="210.0" font-size="20" fill="#111">family_id</text><text x="644" y="250.0" font-size="20" fill="#1d4ed8">customer_id (FK)</text><text x="644" y="290.0" font-size="20" fill="#111">order_date</text><text x="644" y="330.0" font-size="20" fill="#111">sales_channel</text><text x="644" y="370.0" font-size="20" fill="#111">total_amount</text><text x="644" y="410.0" font-size="20" fill="#111">order_details (TEXT)</text><rect x="1130" y="100" width="340" height="256" rx="8" fill="#fff" stroke="#b7791f" stroke-width="3"/><path d="M1130 144 V108 a8 8 0 0 1 8 -8 H1462 a8 8 0 0 1 8 8 V144 Z" fill="#fde9b0" stroke="#b7791f" stroke-width="3"/><text x="1300.0" y="131" text-anchor="middle" font-size="24" font-weight="700" fill="#7a4a05">Warehouses</text><line x1="1130" x2="1470" y1="184" y2="184" stroke="#b7791f" stroke-width="2"/><line x1="1196" x2="1196" y1="144" y2="356" stroke="#b7791f" stroke-width="2"/><text x="1163" y="171" text-anchor="middle" font-size="19" font-weight="700">PK</text><text x="1214" y="171" font-size="21" font-weight="700" text-decoration="underline">warehouse_id</text><text x="1214" y="210.0" font-size="20" fill="#111">location</text><text x="1214" y="250.0" font-size="20" fill="#111">capacity</text><text x="1214" y="290.0" font-size="20" fill="#111">available_space</text><text x="1214" y="330.0" font-size="20" fill="#111">manager_name</text><rect x="1130" y="500" width="340" height="336" rx="8" fill="#fff" stroke="#b91c1c" stroke-width="3"/><path d="M1130 544 V508 a8 8 0 0 1 8 -8 H1462 a8 8 0 0 1 8 8 V544 Z" fill="#fbc9c9" stroke="#b91c1c" stroke-width="3"/><text x="1300.0" y="531" text-anchor="middle" font-size="24" font-weight="700" fill="#b91c1c">Products</text><line x1="1130" x2="1470" y1="584" y2="584" stroke="#b91c1c" stroke-width="2"/><line x1="1196" x2="1196" y1="544" y2="836" stroke="#b91c1c" stroke-width="2"/><text x="1163" y="571" text-anchor="middle" font-size="19" font-weight="700">PK</text><text x="1214" y="571" font-size="21" font-weight="700" text-decoration="underline">product_id</text><text x="1214" y="610.0" font-size="20" fill="#111">product_name</text><text x="1214" y="650.0" font-size="20" fill="#111">product_emoji</text><text x="1214" y="690.0" font-size="20" fill="#111">category</text><text x="1214" y="730.0" font-size="20" fill="#111">price</text><text x="1214" y="770.0" font-size="20" fill="#111">stock_level</text><text x="1214" y="810.0" font-size="20" fill="#1d4ed8">warehouse_id (FK)</text><line x1="360" y1="300" x2="560" y2="300" stroke="#111" stroke-width="2.5"/><path d="M542 300 L560 286 M542 300 L560 300 M542 300 L560 314" fill="none" stroke="#111" stroke-width="2.5"/><text x="380" y="285" font-size="22" font-weight="700">1</text><text x="525" y="285" font-size="22" font-weight="700">N</text><text x="410" y="335" font-size="20" font-style="italic" fill="#2e6b1f">places</text><text x="375" y="360" font-size="15" fill="#555">ON DELETE CASCADE</text><line x1="1300" y1="356" x2="1300" y2="500" stroke="#111" stroke-width="2.5"/><path d="M1300 482 L1286 500 M1300 482 L1300 500 M1300 482 L1314 500" fill="none" stroke="#111" stroke-width="2.5"/><text x="1312" y="378" font-size="22" font-weight="700">1</text><text x="1312" y="480" font-size="22" font-weight="700">N</text><text x="1325" y="432" font-size="20" font-style="italic" fill="#7a4a05">stores</text><rect x="560" y="520" width="480" height="150" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/><text x="580" y="552" font-size="19" font-weight="700">Note</text><text x="580" y="580" font-size="17">Cart items are stored as text in Orders.order_details,</text><text x="580" y="604" font-size="17">e.g. "Milk 1L (x2), Cola 1.5L (x1)".</text><text x="580" y="628" font-size="17">There is no Order_Details junction table, so Orders</text><text x="580" y="652" font-size="17">and Products are not linked by a foreign key.</text><rect x="30" y="520" width="300" height="170" rx="8" fill="#fff" stroke="#64748b" stroke-width="2.5"/><text x="180" y="552" text-anchor="middle" font-size="21" font-weight="700">Legend</text><text x="50" y="590" font-size="18" font-weight="700">PK</text><text x="100" y="590" font-size="18">= Primary Key</text><text x="50" y="620" font-size="18" font-weight="700">FK</text><text x="100" y="620" font-size="18">= Foreign Key</text><text x="50" y="650" font-size="18" font-weight="700">1</text><text x="100" y="650" font-size="18">= One</text><text x="50" y="680" font-size="18" font-weight="700">N</text><text x="100" y="680" font-size="18">= Many (crow's foot)</text></svg>